name: Pack bot
run-name: "Pack bot · ${{ github.event_name == 'issue_comment' && format('ship #{0}', github.event.issue.number) || 'intake' }}"

# Two phases, both headless Claude Code billed to the Claude subscription
# (CLAUDE_CODE_OAUTH_TOKEN), following docs/pack-bot-prompt.md.
#
#   intake — a pack folder lands in inbox/ on main. The bot normalises it into
#            packs/<name>/, registers it, pushes here, then opens an issue with
#            the answers the website page needs.
#   ship   — someone comments /ship on that issue. The bot builds the site page,
#            the download zip and the OG card in the website repo and pushes it.
#
# Setup, secrets and failure modes: docs/pack-bot.md

on:
  push:
    branches: [main]
    paths: ['inbox/**']
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pack:
        description: "pack folder name under inbox/ (blank = whatever is there)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: pack-bot-${{ github.event.issue.number || 'intake' }}
  cancel-in-progress: false

jobs:
  intake:
    # The bot's own push also touches inbox/ (it deletes the folder), so skip our
    # own commits or the workflow retriggers itself forever.
    if: >-
      github.event_name != 'issue_comment' &&
      !contains(github.event.head_commit.message, '[pack-bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install -g @anthropic-ai/claude-code

      - name: Normalise, register and push the pack
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PACK: ${{ inputs.pack }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name  "Polar Bear"
          git config user.email "polar-bear-org@users.noreply.github.com"
          claude -p "Follow docs/pack-bot-prompt.md EXACTLY, phase INTAKE. \
          The pack folder under inbox/ is: '${PACK:-discover it yourself}'. \
          Do the work end to end: normalise, register, validate, commit with a \
          [pack-bot] prefix, push to main, then open the handover issue with gh." \
            --model claude-opus-5 \
            --permission-mode bypassPermissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

  ship:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/ship') &&
      startsWith(github.event.issue.title, 'Pack bot:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }

      # The bot identity. Set the PACK_BOT_APP_ID variable and the
      # PACK_BOT_PRIVATE_KEY secret to use a GitHub App; without them the job
      # falls back to the SITE_REPO_TOKEN PAT. Either needs write access to BOTH
      # repositories.
      - uses: actions/create-github-app-token@v2
        id: app-token
        if: ${{ vars.PACK_BOT_APP_ID != '' }}
        with:
          app-id: ${{ vars.PACK_BOT_APP_ID }}
          private-key: ${{ secrets.PACK_BOT_PRIVATE_KEY }}
          owner: polar-bear-org
          repositories: |
            claude-skills
            polar-bear-people-growth

      - name: Check out the website repo
        uses: actions/checkout@v4
        with:
          repository: polar-bear-org/polar-bear-people-growth
          token: ${{ steps.app-token.outputs.token || secrets.SITE_REPO_TOKEN }}
          path: site
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install the website's dependencies
        working-directory: site
        run: npm ci
      - run: npm install -g @anthropic-ai/claude-code

      - name: Build the page, the zip and the card, then push the site
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SITE_REPO_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config --global user.name  "Polar Bear"
          git config --global user.email "polar-bear-org@users.noreply.github.com"
          claude -p "Follow docs/pack-bot-prompt.md EXACTLY, phase SHIP. \
          The handover issue is #${ISSUE} in this repository; read its body with \
          gh and treat the newest edit as the truth. The website repo is checked \
          out at ./site. Do the work end to end: page, zip, card, all eight \
          registration points, build check, commit, push site main, then comment \
          the live URLs on the issue and close it." \
            --model claude-opus-5 \
            --permission-mode bypassPermissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
